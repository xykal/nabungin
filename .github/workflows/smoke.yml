name: Smoke Test Android (Real Emulator)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Build fresh debug and release APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Prepare APKs
        run: |
          mkdir -p smoke-results
          cp app/build/outputs/apk/release/*.apk smoke-results/release.apk
          cp app/build/outputs/apk/debug/*.apk smoke-results/debug.apk
      - name: Install and launch on emulator (API 35)
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/smoke-android.sh
      - name: Upload logcat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat-${{ github.run_number }}
          path: smoke-results/*.log
          if-no-files-found: warn
          retention-days: 7
